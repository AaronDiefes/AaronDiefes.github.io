name: Deploy React App to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Node 18 reached end-of-life in April 2025. 22 is the active LTS and
          # matches the local toolchain the build is actually verified against.
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # These gate the deploy. Pushing to main publishes, so this is the last
      # place anything can be caught, and each of the three guards exists
      # because something already shipped past a green build:
      #
      #   assets   - twelve doc images 404'd in production for weeks. A broken
      #              URL fails nothing: the build succeeds and the page renders.
      #   cpu      - pipeline behaviour, not arithmetic. Caught an instruction
      #              identity bug that let a flushed instruction reach write-back.
      #   datapath - the 59 datapath edges were validated against processor.v
      #              once; this re-checks that wiring on every push.
      #
      # They run before the build so a failure is attributable and fast. If one
      # fails the deploy job never runs, and Pages keeps serving the last good
      # build - a failure here is a blocked release, not an outage.
      - name: Verify assets resolve
        run: npm run verify:assets

      - name: Verify CPU pipeline model
        run: npm run verify:cpu

      - name: Verify datapath schematic
        run: npm run verify:datapath

      - name: Build React app
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
