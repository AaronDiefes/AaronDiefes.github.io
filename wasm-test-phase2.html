<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phase 2: Full Graphics API Test</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .container {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        h1 { margin-top: 0; color: #333; }
        h2 { color: #667eea; margin-top: 30px; }
        #status {
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            font-family: 'Courier New', monospace;
            font-size: 14px;
        }
        #status.loading { background: #fff3cd; border: 2px solid #ffc107; }
        #status.success { background: #d4edda; border: 2px solid #28a745; }
        #status.error { background: #f8d7da; border: 2px solid #dc3545; }
        canvas {
            border: 2px solid #ddd;
            border-radius: 8px;
            margin: 20px 0;
            display: block;
        }
        .demo-section {
            margin: 30px 0;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
        }
        button {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            margin: 5px;
            transition: transform 0.2s;
        }
        button:hover { transform: translateY(-2px); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .controls { margin: 15px 0; }
        pre {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 6px;
            overflow-x: auto;
            font-size: 12px;
            max-height: 200px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎨 Phase 2: Full Graphics API Test</h1>
        <div id="status" class="loading">Loading WebAssembly module...</div>

        <canvas id="canvas" width="800" height="600"></canvas>

        <div class="demo-section">
            <h2>🔷 Path Drawing</h2>
            <div class="controls">
                <button id="testPaths" disabled>Draw Paths</button>
                <button id="testBezier" disabled>Bezier Curves</button>
                <button id="testCircles" disabled>Circles & Shapes</button>
            </div>
        </div>

        <div class="demo-section">
            <h2>🌈 Gradients & Shaders</h2>
            <div class="controls">
                <button id="testGradient" disabled>Linear Gradient</button>
                <button id="testMultiGradient" disabled>Multi-Stop Gradient</button>
                <button id="testTileModes" disabled>Tile Modes</button>
            </div>
        </div>

        <div class="demo-section">
            <h2>🎭 Blend Modes</h2>
            <div class="controls">
                <button id="testBlendSrcOver" disabled>SrcOver</button>
                <button id="testBlendXor" disabled>Xor</button>
                <button id="testBlendMultiply" disabled>Multiply Effect</button>
            </div>
        </div>

        <div class="demo-section">
            <h2>🔺 Mesh & Quad</h2>
            <div class="controls">
                <button id="testMesh" disabled>Triangle Mesh</button>
                <button id="testQuad" disabled>Tesselated Quad</button>
            </div>
        </div>

        <div class="demo-section">
            <h2>🧹 Utilities</h2>
            <div class="controls">
                <button id="testClear" disabled>Clear Canvas</button>
            </div>
        </div>

        <h3>Log:</h3>
        <pre id="log"></pre>
    </div>

    <script src="graphics_engine.js"></script>
    <script>
        const statusDiv = document.getElementById('status');
        const logPre = document.getElementById('log');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        let wasmCanvas = null;
        let Module = null;

        function log(message) {
            const timestamp = new Date().toLocaleTimeString();
            logPre.textContent += `[${timestamp}] ${message}\n`;
            logPre.scrollTop = logPre.scrollHeight;
        }

        function updateStatus(message, type) {
            statusDiv.textContent = message;
            statusDiv.className = type;
        }

        function updateCanvasDisplay() {
            if (!wasmCanvas || !Module) return;

            try {
                const width = wasmCanvas.getWidth();
                const height = wasmCanvas.getHeight();
                const pixelPtr = wasmCanvas.getPixelsPtr();
                const pixelCount = width * height;

                let wasmPixels;
                if (Module.HEAPU32) {
                    wasmPixels = new Uint32Array(Module.HEAPU32.buffer, pixelPtr, pixelCount);
                } else if (Module.HEAPU8) {
                    wasmPixels = new Uint32Array(Module.HEAPU8.buffer, pixelPtr, pixelCount);
                }

                const imageData = ctx.createImageData(width, height);
                const data = imageData.data;

                for (let i = 0; i < pixelCount; i++) {
                    const argb = wasmPixels[i];
                    const a = (argb >> 24) & 0xFF;
                    let r = (argb >> 16) & 0xFF;
                    let g = (argb >> 8) & 0xFF;
                    let b = argb & 0xFF;

                    // Unpremultiply
                    if (a > 0 && a < 255) {
                        r = Math.round((r * 255) / a);
                        g = Math.round((g * 255) / a);
                        b = Math.round((b * 255) / a);
                    }

                    const idx = i * 4;
                    data[idx] = r;
                    data[idx + 1] = g;
                    data[idx + 2] = b;
                    data[idx + 3] = a;
                }

                ctx.putImageData(imageData, 0, 0);
            } catch (e) {
                log('✗ Error updating canvas: ' + e.message);
            }
        }

        // Initialize
        const startTime = Date.now();
        log('Starting Phase 2 WASM module initialization...');

        GraphicsEngine().then((module) => {
            Module = module;
            const loadTime = Date.now() - startTime;
            log(`✓ WASM module loaded in ${loadTime}ms`);

            wasmCanvas = new Module.CanvasWrapper(800, 600);
            log('✓ Canvas created: ' + wasmCanvas.getWidth() + 'x' + wasmCanvas.getHeight());

            updateStatus(`✅ Phase 2 API Ready! (${loadTime}ms)`, 'success');

            // Enable all buttons
            document.querySelectorAll('button').forEach(btn => btn.disabled = false);

        }).catch((error) => {
            log('✗ Failed to load WASM: ' + error);
            updateStatus('❌ Failed to load WASM', 'error');
        });

        // Path Drawing Tests
        document.getElementById('testPaths').addEventListener('click', () => {
            log('=== Drawing paths ===');
            wasmCanvas.clear(1.0, 1.0, 1.0, 1.0);

            // Create path
            const path = new Module.PathWrapper();
            path.moveTo(100, 100);
            path.lineTo(200, 100);
            path.lineTo(250, 200);
            path.lineTo(150, 250);
            path.lineTo(50, 200);
            path.lineTo(100, 100);

            const paint = new Module.PaintWrapper();
            paint.setColor(0.2, 0.4, 0.8, 1.0);

            wasmCanvas.drawPathWithPaint(path, paint);
            log('✓ Path drawn with ' + path.countPoints() + ' points');

            updateCanvasDisplay();
        });

        document.getElementById('testBezier').addEventListener('click', () => {
            log('=== Drawing Bezier curves ===');
            wasmCanvas.clear(0.95, 0.95, 0.95, 1.0);

            const path = new Module.PathWrapper();
            path.moveTo(100, 300);
            path.quadTo(300, 100, 500, 300);  // Quadratic
            path.moveTo(100, 400);
            path.cubicTo(200, 200, 400, 500, 600, 300);  // Cubic

            const paint = new Module.PaintWrapper();
            paint.setColor(0.8, 0.2, 0.2, 1.0);

            wasmCanvas.drawPathWithPaint(path, paint);
            log('✓ Bezier curves drawn');

            updateCanvasDisplay();
        });

        document.getElementById('testCircles').addEventListener('click', () => {
            log('=== Drawing circles and shapes ===');
            wasmCanvas.clear(1.0, 1.0, 1.0, 1.0);

            // Circle path
            const circle = new Module.PathWrapper();
            circle.addCircle(200, 200, 80, Module.PathDirection.CW);

            const paint1 = new Module.PaintWrapper();
            paint1.setColor(1.0, 0.5, 0.0, 0.8);
            wasmCanvas.drawPathWithPaint(circle, paint1);

            // Rectangle path
            const rect = new Module.PathWrapper();
            rect.addRect(400, 150, 150, 100, Module.PathDirection.CW);

            const paint2 = new Module.PaintWrapper();
            paint2.setColor(0.0, 0.8, 0.4, 0.8);
            wasmCanvas.drawPathWithPaint(rect, paint2);

            log('✓ Circles and shapes drawn');
            updateCanvasDisplay();
        });

        // Gradient Tests
        document.getElementById('testGradient').addEventListener('click', () => {
            log('=== Drawing linear gradient ===');
            wasmCanvas.clear(1.0, 1.0, 1.0, 1.0);

            // Create gradient
            const colors = new Module.VectorFloat();
            // Blue to Yellow
            colors.push_back(0.2); colors.push_back(0.4); colors.push_back(0.8); colors.push_back(1.0);
            colors.push_back(1.0); colors.push_back(0.9); colors.push_back(0.2); colors.push_back(1.0);

            const shader = Module.createLinearGradient(100, 100, 700, 100, colors, Module.TileMode.Clamp);

            const paint = new Module.PaintWrapper();
            paint.setShader(shader.getPtr());

            wasmCanvas.drawRectWithPaint(100, 100, 600, 400, paint);

            log('✓ Linear gradient rendered');
            updateCanvasDisplay();
        });

        document.getElementById('testMultiGradient').addEventListener('click', () => {
            log('=== Drawing multi-stop gradient ===');
            wasmCanvas.clear(0.1, 0.1, 0.1, 1.0);

            const colors = new Module.VectorFloat();
            // Rainbow gradient
            colors.push_back(1.0); colors.push_back(0.0); colors.push_back(0.0); colors.push_back(1.0); // Red
            colors.push_back(1.0); colors.push_back(0.5); colors.push_back(0.0); colors.push_back(1.0); // Orange
            colors.push_back(1.0); colors.push_back(1.0); colors.push_back(0.0); colors.push_back(1.0); // Yellow
            colors.push_back(0.0); colors.push_back(1.0); colors.push_back(0.0); colors.push_back(1.0); // Green
            colors.push_back(0.0); colors.push_back(0.0); colors.push_back(1.0); colors.push_back(1.0); // Blue

            const shader = Module.createLinearGradient(200, 300, 600, 300, colors, Module.TileMode.Clamp);

            const circle = new Module.PathWrapper();
            circle.addCircle(400, 300, 200, Module.PathDirection.CW);

            const paint = new Module.PaintWrapper();
            paint.setShader(shader.getPtr());

            wasmCanvas.drawPathWithPaint(circle, paint);

            log('✓ Multi-stop gradient (5 colors) rendered');
            updateCanvasDisplay();
        });

        document.getElementById('testTileModes').addEventListener('click', () => {
            log('=== Testing tile modes ===');
            wasmCanvas.clear(0.9, 0.9, 0.9, 1.0);

            const colors = new Module.VectorFloat();
            colors.push_back(1.0); colors.push_back(0.0); colors.push_back(0.0); colors.push_back(1.0);
            colors.push_back(0.0); colors.push_back(0.0); colors.push_back(1.0); colors.push_back(1.0);

            // Clamp
            const shader1 = Module.createLinearGradient(50, 100, 150, 100, colors, Module.TileMode.Clamp);
            const paint1 = new Module.PaintWrapper();
            paint1.setShader(shader1.getPtr());
            wasmCanvas.drawRectWithPaint(50, 100, 200, 80, paint1);

            // Repeat
            const shader2 = Module.createLinearGradient(300, 250, 400, 250, colors, Module.TileMode.Repeat);
            const paint2 = new Module.PaintWrapper();
            paint2.setShader(shader2.getPtr());
            wasmCanvas.drawRectWithPaint(300, 250, 200, 80, paint2);

            // Mirror
            const shader3 = Module.createLinearGradient(550, 400, 650, 400, colors, Module.TileMode.Mirror);
            const paint3 = new Module.PaintWrapper();
            paint3.setShader(shader3.getPtr());
            wasmCanvas.drawRectWithPaint(550, 400, 200, 80, paint3);

            log('✓ Tile modes: Clamp, Repeat, Mirror');
            updateCanvasDisplay();
        });

        // Blend Mode Tests
        document.getElementById('testBlendSrcOver').addEventListener('click', () => {
            log('=== Testing blend modes ===');
            wasmCanvas.clear(0.9, 0.9, 0.9, 1.0);

            const paint1 = new Module.PaintWrapper();
            paint1.setColor(1.0, 0.0, 0.0, 0.8);
            wasmCanvas.drawRectWithPaint(100, 100, 200, 200, paint1);

            const paint2 = new Module.PaintWrapper();
            paint2.setColor(0.0, 0.0, 1.0, 0.8);
            paint2.setBlendMode(Module.BlendMode.SrcOver);
            wasmCanvas.drawRectWithPaint(200, 150, 200, 200, paint2);

            log('✓ Blend mode: SrcOver');
            updateCanvasDisplay();
        });

        document.getElementById('testBlendXor').addEventListener('click', () => {
            log('=== Testing Xor blend ===');
            wasmCanvas.clear(1.0, 1.0, 1.0, 1.0);

            const paint1 = new Module.PaintWrapper();
            paint1.setColor(1.0, 0.5, 0.0, 1.0);
            wasmCanvas.drawRectWithPaint(150, 150, 250, 250, paint1);

            const paint2 = new Module.PaintWrapper();
            paint2.setColor(0.0, 0.5, 1.0, 1.0);
            paint2.setBlendMode(Module.BlendMode.Xor);
            wasmCanvas.drawRectWithPaint(300, 200, 250, 250, paint2);

            log('✓ Blend mode: Xor');
            updateCanvasDisplay();
        });

        document.getElementById('testBlendMultiply').addEventListener('click', () => {
            log('=== Demonstrating blend effects ===');
            wasmCanvas.clear(1.0, 1.0, 1.0, 1.0);

            // Draw overlapping circles with different blend modes
            const modes = [
                { mode: Module.BlendMode.SrcOver, x: 200, name: 'SrcOver' },
                { mode: Module.BlendMode.DstOver, x: 400, name: 'DstOver' },
                { mode: Module.BlendMode.SrcIn, x: 600, name: 'SrcIn' }
            ];

            modes.forEach(({ mode, x, name }) => {
                const circle1 = new Module.PathWrapper();
                circle1.addCircle(x, 250, 80, Module.PathDirection.CW);
                const paint1 = new Module.PaintWrapper();
                paint1.setColor(1.0, 0.0, 0.0, 0.7);
                wasmCanvas.drawPathWithPaint(circle1, paint1);

                const circle2 = new Module.PathWrapper();
                circle2.addCircle(x + 50, 300, 80, Module.PathDirection.CW);
                const paint2 = new Module.PaintWrapper();
                paint2.setColor(0.0, 0.0, 1.0, 0.7);
                paint2.setBlendMode(mode);
                wasmCanvas.drawPathWithPaint(circle2, paint2);
            });

            log('✓ Blend modes demonstrated');
            updateCanvasDisplay();
        });

        // Mesh Tests
        document.getElementById('testMesh').addEventListener('click', () => {
            log('=== Drawing triangle mesh ===');
            wasmCanvas.clear(1.0, 1.0, 1.0, 1.0);

            const verts = new Module.VectorFloat();
            verts.push_back(400); verts.push_back(100);  // Top
            verts.push_back(200); verts.push_back(400);  // Bottom left
            verts.push_back(600); verts.push_back(400);  // Bottom right

            const colors = new Module.VectorFloat();
            colors.push_back(1.0); colors.push_back(0.0); colors.push_back(0.0); colors.push_back(1.0);  // Red
            colors.push_back(0.0); colors.push_back(1.0); colors.push_back(0.0); colors.push_back(1.0);  // Green
            colors.push_back(0.0); colors.push_back(0.0); colors.push_back(1.0); colors.push_back(1.0);  // Blue

            const indices = new Module.VectorInt();
            indices.push_back(0); indices.push_back(1); indices.push_back(2);

            const paint = new Module.PaintWrapper();
            wasmCanvas.drawMesh(verts, colors, new Module.VectorFloat(), indices, paint);

            log('✓ Triangle mesh with vertex colors');
            updateCanvasDisplay();
        });

        document.getElementById('testQuad').addEventListener('click', () => {
            log('=== Drawing tesselated quad ===');
            wasmCanvas.clear(0.95, 0.95, 0.95, 1.0);

            const verts = new Module.VectorFloat();
            verts.push_back(150); verts.push_back(150);
            verts.push_back(650); verts.push_back(150);
            verts.push_back(650); verts.push_back(450);
            verts.push_back(150); verts.push_back(450);

            const colors = new Module.VectorFloat();
            colors.push_back(1.0); colors.push_back(0.0); colors.push_back(0.0); colors.push_back(1.0);
            colors.push_back(0.0); colors.push_back(1.0); colors.push_back(0.0); colors.push_back(1.0);
            colors.push_back(0.0); colors.push_back(0.0); colors.push_back(1.0); colors.push_back(1.0);
            colors.push_back(1.0); colors.push_back(1.0); colors.push_back(0.0); colors.push_back(1.0);

            const paint = new Module.PaintWrapper();
            wasmCanvas.drawQuad(verts, colors, new Module.VectorFloat(), 3, paint);

            log('✓ Quad with level-3 tesselation');
            updateCanvasDisplay();
        });

        // Utilities
        document.getElementById('testClear').addEventListener('click', () => {
            log('Clearing canvas...');
            wasmCanvas.clear(0.9, 0.9, 0.9, 1.0);
            updateCanvasDisplay();
            log('✓ Canvas cleared');
        });
    </script>
</body>
</html>
