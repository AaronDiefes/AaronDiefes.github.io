<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CPU Visualizer - Integration Tests</title>

  <!-- Load design system and visualization CSS -->
  <link rel="stylesheet" href="../docs/assets/css/design-system.css">
  <link rel="stylesheet" href="src/visualization/visualization.css">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Monaco', 'Courier New', monospace;
      background: #f5f5f5;
      padding: 20px;
    }

    .page-container {
      max-width: 1400px;
      margin: 0 auto;
    }

    .section {
      background: white;
      padding: 30px;
      margin-bottom: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    h1 {
      font-size: 24px;
      margin-bottom: 10px;
      color: #2c3e50;
    }

    h2 {
      font-size: 20px;
      margin-bottom: 15px;
      color: #2c3e50;
    }

    .subtitle {
      color: #6c757d;
      margin-bottom: 20px;
    }

    /* Live visualization controls */
    .controls {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
      align-items: center;
    }

    .controls select,
    .controls button {
      padding: 8px 16px;
      font-size: 14px;
      border: 1px solid #ddd;
      border-radius: 4px;
      background: white;
      cursor: pointer;
    }

    .controls button:hover {
      background: #f0f0f0;
    }

    .controls button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .status {
      font-size: 14px;
      color: #6c757d;
      padding: 8px;
    }

    /* Test results styles */
    .summary {
      font-size: 18px;
      padding: 15px;
      margin: 20px 0;
      border-radius: 4px;
      font-weight: bold;
    }

    .summary.success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }

    .summary.failure {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }

    .test-section {
      margin-bottom: 30px;
    }

    .test-section h3 {
      font-size: 18px;
      color: #495057;
      margin-bottom: 10px;
      padding-bottom: 5px;
      border-bottom: 2px solid #dee2e6;
    }

    .test-item {
      padding: 8px 12px;
      margin: 4px 0;
      border-radius: 4px;
      font-size: 14px;
    }

    .test-item.pass {
      background: #d4edda;
      color: #155724;
    }

    .test-item.fail {
      background: #f8d7da;
      color: #721c24;
    }

    .test-item .label {
      font-weight: bold;
      margin-right: 8px;
    }

    .error-details {
      margin-top: 4px;
      padding: 8px;
      background: #fff;
      border-left: 3px solid #dc3545;
      font-size: 12px;
      color: #6c757d;
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: #6c757d;
      font-size: 16px;
    }

    /* Visualization container styling */
    #viz-container {
      margin-top: 20px;
      min-height: 400px;
    }
  </style>
</head>
<body>
  <div class="page-container">
    <!-- Live Visualization Section -->
    <section class="section">
      <h1>CPU Visualizer - Live Demo</h1>
      <p class="subtitle">Interactive block diagram visualization with step controls</p>

      <div class="controls">
        <label for="program-select">Program:</label>
        <select id="program-select">
          <option value="basic">Basic Instructions</option>
          <option value="fibonacci">Fibonacci</option>
        </select>

        <button id="btn-step-back">◀ Step Back</button>
        <button id="btn-step-forward">Step Forward ▶</button>
        <button id="btn-reset">↺ Reset</button>

        <span class="status" id="status">Frame 0 of 0</span>
      </div>

      <div id="viz-container"></div>
    </section>

    <!-- Automated Tests Section -->
    <section class="section">
      <h1>Automated Tests</h1>
      <p class="subtitle">Comprehensive tests for BlockDiagramView, RegisterView, and CPUVisualizer integration</p>

      <div id="summary" class="loading">Running tests...</div>
      <div id="results"></div>
    </section>
  </div>

  <!-- Load Phase 9 modules in dependency order -->
  <script src="src/core/cpu-state.js"></script>
  <script src="src/core/instruction-set.js"></script>
  <script src="src/animation/timing-controller.js"></script>
  <script src="src/animation/animation-engine.js"></script>
  <script src="src/core/sequence-generator.js"></script>
  <script src="src/programs/basic-instructions.js"></script>
  <script src="src/programs/fibonacci.js"></script>

  <!-- Load Phase 10 visualization modules -->
  <script src="src/visualization/block-diagram-view.js"></script>
  <script src="src/visualization/register-view.js"></script>
  <script src="src/visualization/cpu-visualizer.js"></script>

  <!-- Test suite and live demo -->
  <script>
    (function() {
      'use strict';

      // Test framework
      let passCount = 0;
      let failCount = 0;
      const results = [];

      function test(name, fn) {
        try {
          fn();
          passCount++;
          results.push({ name, pass: true });
        } catch (e) {
          failCount++;
          results.push({ name, pass: false, error: e.message });
        }
      }

      function assert(condition, message) {
        if (!condition) {
          throw new Error(message || 'Assertion failed');
        }
      }

      function assertEquals(actual, expected, message) {
        if (actual !== expected) {
          throw new Error(message || `Expected ${expected}, got ${actual}`);
        }
      }

      function assertGreaterThan(actual, threshold, message) {
        if (actual <= threshold) {
          throw new Error(message || `Expected ${actual} > ${threshold}`);
        }
      }

      // Live demo state
      let animationEngine = null;
      let visualizer = null;
      let currentProgram = 'basic';

      // Initialize live demo when DOM is ready
      document.addEventListener('DOMContentLoaded', function() {
        initializeLiveDemo();
        runAllTests();
        displayResults();
      });

      function initializeLiveDemo() {
        const vizContainer = document.getElementById('viz-container');
        const programSelect = document.getElementById('program-select');
        const btnStepBack = document.getElementById('btn-step-back');
        const btnStepForward = document.getElementById('btn-step-forward');
        const btnReset = document.getElementById('btn-reset');
        const statusEl = document.getElementById('status');

        // Create visualizer
        visualizer = new CPUVisualizer(vizContainer);

        // Create animation engine
        animationEngine = new AnimationEngine();

        // Listen to frame changes to update status
        window.addEventListener('cpu:framechange', function(e) {
          const index = e.detail.index;
          const total = animationEngine.getTotalFrames();
          statusEl.textContent = `Frame ${index} of ${total - 1}`;
        });

        // Load initial program
        loadProgram(currentProgram);

        // Wire up controls
        programSelect.addEventListener('change', function() {
          currentProgram = this.value;
          loadProgram(currentProgram);
        });

        btnStepBack.addEventListener('click', function() {
          animationEngine.stepBackward();
        });

        btnStepForward.addEventListener('click', function() {
          animationEngine.stepForward();
        });

        btnReset.addEventListener('click', function() {
          animationEngine.reset();
        });
      }

      function loadProgram(programName) {
        const program = programName === 'basic' ? BASIC_PROGRAM : FIBONACCI_PROGRAM;
        const result = SequenceGenerator.generateSequence(program.instructions);
        animationEngine.loadFrames(result.frames);

        const statusEl = document.getElementById('status');
        statusEl.textContent = `Frame 0 of ${result.frames.length - 1}`;
      }

      function runAllTests() {
        // ============================================
        // BLOCKDIAGRAMVIEW TESTS
        // ============================================

        test('BlockDiagramView creates SVG element with viewBox', function() {
          const container = document.createElement('div');
          const view = new BlockDiagramView(container);

          const svg = container.querySelector('svg');
          assert(svg, 'SVG element should exist');
          assert(svg.getAttribute('viewBox'), 'SVG should have viewBox attribute');
        });

        test('BlockDiagramView renders major hardware components', function() {
          const container = document.createElement('div');
          const view = new BlockDiagramView(container);

          assert(container.querySelector('[data-component="IMEM"]'), 'IMEM component exists');
          assert(container.querySelector('[data-component="REGFILE"]'), 'REGFILE component exists');
          assert(container.querySelector('[data-component="ALU"]'), 'ALU component exists');
          assert(container.querySelector('[data-component="DMEM"]'), 'DMEM component exists');
        });

        test('BlockDiagramView renders pipeline registers', function() {
          const container = document.createElement('div');
          const view = new BlockDiagramView(container);

          assert(container.querySelector('[data-pipeline-reg="FD"]'), 'F/D register exists');
          assert(container.querySelector('[data-pipeline-reg="DX"]'), 'D/X register exists');
          assert(container.querySelector('[data-pipeline-reg="XM"]'), 'X/M register exists');
          assert(container.querySelector('[data-pipeline-reg="MW"]'), 'M/W register exists');
        });

        test('BlockDiagramView renders multiplexers', function() {
          const container = document.createElement('div');
          const view = new BlockDiagramView(container);

          const muxes = container.querySelectorAll('[data-mux]');
          assertGreaterThan(muxes.length, 1, 'Should have at least 2 multiplexers');
        });

        test('BlockDiagramView highlights active components on render', function() {
          const container = document.createElement('div');
          const view = new BlockDiagramView(container);
          const state = CPUState.createInitial();

          state.pipeline.EX.active = true;
          view.render(state);

          const alu = container.querySelector('[data-component="ALU"]');
          assert(alu.classList.contains('active'), 'ALU should be highlighted when EX stage is active');
        });

        test('BlockDiagramView updates pipeline register instruction display', function() {
          const container = document.createElement('div');
          const view = new BlockDiagramView(container);
          const state = CPUState.createInitial();

          state.pipeline.IF.active = true;
          state.pipeline.IF.instruction = InstructionSet.createInstruction('ADDI', {
            rs: 0, rt: 8, immediate: 10
          });
          view.render(state);

          const fdDisplay = container.querySelector('[data-instruction-display="FD"]');
          assert(fdDisplay.textContent !== 'NOP', 'F/D register should show instruction (not NOP)');
          assert(fdDisplay.textContent.includes('ADDI'), 'F/D register should show ADDI instruction');
        });

        test('BlockDiagramView shows NOP when stage is inactive', function() {
          const container = document.createElement('div');
          const view = new BlockDiagramView(container);
          const state = CPUState.createInitial();

          // All stages inactive
          view.render(state);

          const displays = container.querySelectorAll('[data-instruction-display]');
          displays.forEach(display => {
            assertEquals(display.textContent, 'NOP', 'Inactive stages should show NOP');
          });
        });

        // ============================================
        // REGISTERVIEW TESTS
        // ============================================

        test('RegisterView creates 32 register cells', function() {
          const container = document.createElement('div');
          const view = new RegisterView(container);

          const cells = container.querySelectorAll('[data-register]');
          assertEquals(cells.length, 32, 'Should have 32 register cells');

          // Check first and last
          assert(container.querySelector('[data-register="0"]'), 'Register $0 exists');
          assert(container.querySelector('[data-register="31"]'), 'Register $31 exists');
        });

        test('RegisterView shows hex values', function() {
          const container = document.createElement('div');
          const view = new RegisterView(container);
          const state = CPUState.createInitial();

          view.render(state);

          const values = container.querySelectorAll('.register-value');
          values.forEach(el => {
            assert(el.textContent.startsWith('0x'), 'Values should be hex format');
          });
        });

        test('RegisterView highlights changed registers', function() {
          const container = document.createElement('div');
          const view = new RegisterView(container);
          const state = CPUState.createInitial();

          // First render to initialize
          view.render(state);

          // Second render with changes
          state.setRegister(5, 0x12345678);
          state.setRegister(7, 0xABCDEF00);
          view.render(state);

          const cell5 = container.querySelector('[data-register="5"]');
          const cell7 = container.querySelector('[data-register="7"]');

          assert(cell5.classList.contains('changed'), 'Register 5 should be highlighted');
          assert(cell7.classList.contains('changed'), 'Register 7 should be highlighted');

          const value5 = cell5.querySelector('.register-value');
          assertEquals(value5.textContent, '0x12345678', 'Register 5 value should update');
        });

        test('RegisterView removes highlight on next render', function() {
          const container = document.createElement('div');
          const view = new RegisterView(container);
          const state = CPUState.createInitial();

          // First render
          view.render(state);

          // Second render with changes
          state.setRegister(5, 100);
          view.render(state);

          assert(container.querySelector('[data-register="5"]').classList.contains('changed'),
            'Should have highlight after change');

          // Third render with no changes
          const state2 = state.clone();
          state2.changedRegisters.clear();
          view.render(state2);

          assert(!container.querySelector('[data-register="5"]').classList.contains('changed'),
            'Highlight should be removed');
        });

        test('Register $0 cell exists', function() {
          const container = document.createElement('div');
          const view = new RegisterView(container);

          const cell0 = container.querySelector('[data-register="0"]');
          assert(cell0, 'Register $0 cell exists');
        });

        // ============================================
        // CPUVISUALIZER INTEGRATION TESTS
        // ============================================

        test('CPUVisualizer creates DOM with block diagram and register sections', function() {
          const container = document.createElement('div');
          const visualizer = new CPUVisualizer(container);

          assert(container.querySelector('[data-block-diagram]'), 'Block diagram container exists');
          assert(container.querySelector('[data-register-view]'), 'Register view container exists');
        });

        test('CPUVisualizer does NOT create pipeline-view or execution-view', function() {
          const container = document.createElement('div');
          const visualizer = new CPUVisualizer(container);

          assert(!container.querySelector('[data-pipeline-view]'), 'Pipeline view should NOT exist');
          assert(!container.querySelector('[data-execution-view]'), 'Execution view should NOT exist');
        });

        test('CPUVisualizer responds to cpu:framechange event', function() {
          const container = document.createElement('div');
          const visualizer = new CPUVisualizer(container);
          const state = CPUState.createInitial();

          state.pipeline.IF.active = true;
          state.pipeline.IF.instruction = InstructionSet.createInstruction('ADDI', {
            rs: 0, rt: 8, immediate: 42
          });

          // Dispatch synthetic event
          const event = new CustomEvent('cpu:framechange', {
            detail: { state: state, index: 1, total: 10 }
          });
          window.dispatchEvent(event);

          // Check if block diagram was updated
          const alu = container.querySelector('[data-component="IMEM"]');
          assert(alu, 'Components should be rendered');
        });

        test('CPUVisualizer full program playback', function() {
          const container = document.createElement('div');
          const visualizer = new CPUVisualizer(container);
          const engine = new AnimationEngine();

          const result = SequenceGenerator.generateSequence(BASIC_PROGRAM.instructions);
          engine.loadFrames(result.frames);

          // Step forward 6 times (through first instruction's WB stage)
          for (let i = 0; i < 6; i++) {
            engine.stepForward();
          }

          // Check that visualization has active components
          const activeComponents = container.querySelectorAll('.component.active, .multiplexer.active');
          assertGreaterThan(activeComponents.length, 0, 'At least one component should be active');
        });

        test('CPUVisualizer destroy() cleans up', function() {
          const container = document.createElement('div');
          const visualizer = new CPUVisualizer(container);

          visualizer.destroy();

          // Dispatch event after destroy
          const state = CPUState.createInitial();
          const event = new CustomEvent('cpu:framechange', {
            detail: { state: state }
          });

          // This should not throw an error
          window.dispatchEvent(event);

          // Container should be empty
          assertEquals(container.innerHTML, '', 'Container should be cleared');
        });
      }

      function displayResults() {
        const summaryEl = document.getElementById('summary');
        const resultsEl = document.getElementById('results');

        // Summary
        const total = passCount + failCount;
        if (failCount === 0) {
          summaryEl.className = 'summary success';
          summaryEl.textContent = `✓ All ${total} tests passed!`;
        } else {
          summaryEl.className = 'summary failure';
          summaryEl.textContent = `✗ ${failCount} of ${total} tests failed`;
        }

        // Group results by component
        const sections = {
          'BlockDiagramView': [],
          'RegisterView': [],
          'CPUVisualizer': []
        };

        results.forEach(result => {
          if (result.name.includes('BlockDiagramView')) {
            sections['BlockDiagramView'].push(result);
          } else if (result.name.includes('RegisterView')) {
            sections['RegisterView'].push(result);
          } else if (result.name.includes('CPUVisualizer')) {
            sections['CPUVisualizer'].push(result);
          }
        });

        // Render sections
        Object.keys(sections).forEach(sectionName => {
          if (sections[sectionName].length === 0) return;

          const sectionDiv = document.createElement('div');
          sectionDiv.className = 'test-section';

          const title = document.createElement('h3');
          title.textContent = sectionName + ' Tests';
          sectionDiv.appendChild(title);

          sections[sectionName].forEach(result => {
            const item = document.createElement('div');
            item.className = 'test-item ' + (result.pass ? 'pass' : 'fail');

            const label = document.createElement('span');
            label.className = 'label';
            label.textContent = result.pass ? 'PASS' : 'FAIL';
            item.appendChild(label);

            const name = document.createTextNode(result.name);
            item.appendChild(name);

            if (!result.pass && result.error) {
              const error = document.createElement('div');
              error.className = 'error-details';
              error.textContent = result.error;
              item.appendChild(error);
            }

            sectionDiv.appendChild(item);
          });

          resultsEl.appendChild(sectionDiv);
        });
      }
    })();
  </script>
</body>
</html>
