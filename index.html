<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aaron Diefes - Portfolio</title>
    <!--
      Decoder for the SPA redirect in public/404.html. GitHub Pages has no
      server-side rewrite, so a deep link arrives here as /?/projects/cpu/demo.
      Restore the real path before the app mounts so React Router sees it.
      Must run before /src/main.jsx. See public/404.html for the encoder.
    -->
    <!--
      Theme bootstrap. Must be inline and synchronous, before the module script:
      it stamps data-theme on <html> ahead of first paint so a visitor who chose
      dark never sees a flash of light. Only stamps when there IS a stored
      choice - otherwise nothing is set and the prefers-color-scheme block in
      theme.css governs. Storage key must match THEME_KEY in src/lib/theme.js.
    -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('ad-theme')
          if (t === 'light' || t === 'dark') {
            document.documentElement.setAttribute('data-theme', t)
          }
        } catch (e) {
          /* blocked storage: fall through to the system preference */
        }
      })()
    </script>
    <script>
      (function () {
        var l = window.location
        if (l.search[1] !== '/') return
        var decoded = l.search
          .slice(1)
          .split('&')
          .map(function (s) {
            return s.replace(/~and~/g, '&')
          })
          .join('?')
        window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
