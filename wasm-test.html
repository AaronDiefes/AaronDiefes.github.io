<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WASM Graphics Engine Test</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .container {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        h1 {
            margin-top: 0;
            color: #333;
        }
        #status {
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            font-family: 'Courier New', monospace;
            font-size: 14px;
        }
        #status.loading {
            background: #fff3cd;
            border: 2px solid #ffc107;
        }
        #status.success {
            background: #d4edda;
            border: 2px solid #28a745;
        }
        #status.error {
            background: #f8d7da;
            border: 2px solid #dc3545;
        }
        canvas {
            border: 2px solid #ddd;
            border-radius: 8px;
            margin: 20px 0;
            display: block;
        }
        button {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            margin: 10px 10px 10px 0;
            transition: transform 0.2s;
        }
        button:hover {
            transform: translateY(-2px);
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .controls {
            margin: 20px 0;
        }
        pre {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 6px;
            overflow-x: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎨 WASM Graphics Engine Test</h1>
        <div id="status" class="loading">Loading WebAssembly module...</div>

        <canvas id="canvas" width="600" height="400"></canvas>

        <div class="controls">
            <button id="testBasic" disabled>Test Basic Shapes</button>
            <button id="testTransforms" disabled>Test Transformations</button>
            <button id="testClear" disabled>Clear Canvas</button>
        </div>

        <h3>Log:</h3>
        <pre id="log"></pre>
    </div>

    <script src="graphics_engine.js"></script>
    <script>
        const statusDiv = document.getElementById('status');
        const logPre = document.getElementById('log');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        let wasmCanvas = null;
        let Module = null;

        function log(message) {
            const timestamp = new Date().toLocaleTimeString();
            logPre.textContent += `[${timestamp}] ${message}\n`;
            logPre.scrollTop = logPre.scrollHeight;
        }

        function updateStatus(message, type) {
            statusDiv.textContent = message;
            statusDiv.className = type;
        }

        // Initialize WASM module with progress tracking
        const startTime = Date.now();
        log('Starting WASM module initialization...');

        GraphicsEngine({
            print: (text) => log('WASM: ' + text),
            printErr: (text) => log('WASM Error: ' + text),
            onRuntimeInitialized: () => {
                log('✓ Runtime initialized');
            }
        }).then((module) => {
            Module = module;
            const loadTime = Date.now() - startTime;
            log(`✓ WebAssembly module loaded in ${loadTime}ms`);

            // Create canvas wrapper
            try {
                wasmCanvas = new Module.CanvasWrapper(600, 400);
                log('✓ Canvas created: ' + wasmCanvas.getWidth() + 'x' + wasmCanvas.getHeight());

                // Get pixel buffer pointer
                const pixelPtr = wasmCanvas.getPixelsPtr();
                log('✓ Pixel buffer at: 0x' + pixelPtr.toString(16));

                updateStatus(`✅ WASM Engine Ready! (loaded in ${loadTime}ms)`, 'success');

                // Enable buttons
                document.getElementById('testBasic').disabled = false;
                document.getElementById('testTransforms').disabled = false;
                document.getElementById('testClear').disabled = false;

            } catch (e) {
                log('✗ Error creating canvas: ' + e.message);
                log('Stack trace: ' + e.stack);
                updateStatus('❌ Error: ' + e.message, 'error');
            }
        }).catch((error) => {
            log('✗ Failed to load WASM module: ' + error);
            log('Error details: ' + error.stack);
            updateStatus('❌ Failed to load WASM module', 'error');
        });

        // Helper: Transfer WASM pixels to HTML canvas
        function updateCanvasDisplay() {
            if (!wasmCanvas || !Module) {
                log('✗ Cannot update: wasmCanvas or Module not initialized');
                return;
            }

            try {
                const width = wasmCanvas.getWidth();
                const height = wasmCanvas.getHeight();
                const pixelPtr = wasmCanvas.getPixelsPtr();

                console.log('Pixel buffer pointer:', '0x' + pixelPtr.toString(16));
                console.log('HEAPU32 buffer size:', Module.HEAPU32.buffer.byteLength);

                // Get pixel data from WASM memory (ARGB premultiplied format)
                const pixelCount = width * height;
                const wasmPixels = new Uint32Array(Module.HEAPU32.buffer, pixelPtr, pixelCount);

                console.log('Reading', pixelCount, 'pixels from WASM memory');
                console.log('First few pixels:', wasmPixels.slice(0, 5));

                // Create ImageData and convert ARGB premultiplied to RGBA non-premultiplied
                const imageData = ctx.createImageData(width, height);
                const data = imageData.data;

                for (let i = 0; i < pixelCount; i++) {
                    const argb = wasmPixels[i];
                    const a = (argb >> 24) & 0xFF;
                    let r = (argb >> 16) & 0xFF;
                    let g = (argb >> 8) & 0xFF;
                    let b = argb & 0xFF;

                    // Unpremultiply RGB by alpha (pixels are premultiplied in C++)
                    if (a > 0 && a < 255) {
                        r = Math.round((r * 255) / a);
                        g = Math.round((g * 255) / a);
                        b = Math.round((b * 255) / a);
                    }

                    const idx = i * 4;
                    data[idx] = r;
                    data[idx + 1] = g;
                    data[idx + 2] = b;
                    data[idx + 3] = a;
                }

                ctx.putImageData(imageData, 0, 0);
                log('✓ Canvas updated (' + pixelCount + ' pixels transferred)');
            } catch (e) {
                log('✗ Error updating canvas: ' + e.message);
                console.error('Canvas update error:', e);
            }
        }

        // Test: Basic shapes
        document.getElementById('testBasic').addEventListener('click', () => {
            log('=== Drawing basic shapes ===');
            console.log('Canvas dimensions:', wasmCanvas.getWidth(), 'x', wasmCanvas.getHeight());

            // Clear to white
            log('Calling clear(1.0, 1.0, 1.0, 1.0)...');
            wasmCanvas.clear(1.0, 1.0, 1.0, 1.0);
            log('  ✓ Clear completed');

            // Draw red rectangle
            log('Calling drawRect(50, 50, 200, 150) - RED...');
            wasmCanvas.drawRect(50, 50, 200, 150, 1.0, 0.0, 0.0, 1.0);
            log('  ✓ Red rectangle drawn');

            // Draw blue rectangle
            log('Calling drawRect(150, 100, 200, 150) - BLUE...');
            wasmCanvas.drawRect(150, 100, 200, 150, 0.0, 0.0, 1.0, 0.5);
            log('  ✓ Blue semi-transparent rectangle drawn');

            // Draw triangle (convex polygon)
            log('Calling drawConvexPolygon() - GREEN triangle...');
            const trianglePoints = [300, 50, 500, 50, 400, 200];
            const pointsVector = new Module.VectorFloat();
            trianglePoints.forEach(p => pointsVector.push_back(p));
            wasmCanvas.drawConvexPolygon(pointsVector, 0.0, 1.0, 0.0, 0.8);
            pointsVector.delete();
            log('  ✓ Green triangle drawn');

            log('Transferring pixels to canvas...');
            updateCanvasDisplay();
            log('✓✓✓ Basic shapes rendering complete ✓✓✓');
        });

        // Test: Transformations
        document.getElementById('testTransforms').addEventListener('click', () => {
            log('=== Testing transformations ===');

            log('Clearing canvas...');
            wasmCanvas.clear(1.0, 1.0, 1.0, 1.0);

            // Save state
            log('Saving canvas state...');
            wasmCanvas.save();

            // Translate and rotate
            log('Applying transformations: translate(300, 200), rotate(45°), scale(1.5)...');
            wasmCanvas.translate(300, 200);
            wasmCanvas.rotate(Math.PI / 4);  // 45 degrees
            wasmCanvas.scale(1.5, 1.5);

            // Draw transformed rectangle
            log('Drawing transformed orange square...');
            wasmCanvas.drawRect(-50, -50, 100, 100, 1.0, 0.5, 0.0, 1.0);
            log('  ✓ Rotated orange square drawn');

            // Restore state
            log('Restoring canvas state...');
            wasmCanvas.restore();

            // Draw untransformed rectangle
            log('Drawing untransformed purple square...');
            wasmCanvas.drawRect(450, 50, 100, 100, 0.5, 0.0, 1.0, 1.0);
            log('  ✓ Normal purple square drawn');

            log('Transferring pixels to canvas...');
            updateCanvasDisplay();
            log('✓✓✓ Transformations rendering complete ✓✓✓');
        });

        // Test: Clear
        document.getElementById('testClear').addEventListener('click', () => {
            log('Clearing canvas...');
            wasmCanvas.clear(0.9, 0.9, 0.9, 1.0);
            updateCanvasDisplay();
            log('✓ Canvas cleared');
        });
    </script>
</body>
</html>
